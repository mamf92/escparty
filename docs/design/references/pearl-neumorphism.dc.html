<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build a quiz, pearl neumorphism</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Righteous&amp;family=DM+Sans:opsz,wght@9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFC2E0}
.n2 *{box-sizing:border-box}
.n2{--ink:#140810;--p:#F7EEF3;--dk:rgba(150,60,110,.32);--lt:#FFFFFF;--up:-6px -6px 14px var(--lt),7px 8px 16px var(--dk);--in:inset 4px 5px 10px var(--dk),inset -4px -4px 10px var(--lt);font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse 520px 420px at 50% 40px,#7A1356,#3B0628 70%)}
.n2 .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;color:#fff}
.n2 .brand{font-family:Righteous,sans-serif;font-size:18px;letter-spacing:.1em}
.n2 .switch{display:flex;align-items:center;gap:10px;font:inherit;font-weight:700;font-size:14px;background:none;border:0;color:inherit;min-height:44px;cursor:pointer;padding:0}
.n2 .track{width:48px;height:28px;border-radius:14px;position:relative;background:var(--p);box-shadow:inset 3px 4px 8px rgba(80,0,50,.45)}
.n2 .knob{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--ink)}
.n2 main{padding:4px 20px 32px;display:flex;flex-direction:column;gap:22px}
.n2 h1{font-family:Righteous,sans-serif;font-weight:400;font-size:46px;line-height:1;margin:14px 0 0;text-align:center;color:#fff}
.n2 .sub{margin:0;text-align:center;font-size:16px;line-height:1.45;color:#FCE3F1}
.n2 .pane{display:flex;flex-direction:column;gap:10px;padding:22px 20px;border-radius:30px;background:var(--p);box-shadow:0 22px 40px rgba(15,0,10,.5),inset 0 2px 0 #fff}
.n2 .lab{font-weight:700;font-size:14px;margin:4px 0 0;color:#A30A58}
.n2 .field{font:inherit;font-size:16px;font-weight:500;border:0;outline:0;padding:15px 18px;border-radius:18px;width:100%;color:var(--ink);background:var(--p);box-shadow:var(--in)}
.n2 .field:focus-visible{box-shadow:var(--in),0 0 0 3px #E0177E}
.n2 textarea.field{resize:none;line-height:1.35}
.n2 .sel{position:relative}
.n2 select.field{appearance:none;padding-right:48px}
.n2 .chev{position:absolute;right:18px;top:50%;margin-top:-9px;pointer-events:none}
.n2 .ph{font-family:Righteous,sans-serif;font-weight:400;font-size:22px;margin:0}
.n2 .head{display:flex;align-items:center;gap:10px}
.n2 .count{font-size:14px;font-weight:700;color:#fff;background:var(--ink);border-radius:999px;padding:3px 12px}
.n2 ol{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.n2 .row{width:100%;display:flex;gap:14px;align-items:center;text-align:left;font:inherit;font-size:16px;font-weight:500;line-height:1.3;padding:14px 16px;border:0;border-radius:22px;cursor:pointer;color:var(--ink);background:var(--p);box-shadow:var(--up);min-height:60px}
.n2 .row.on{box-shadow:var(--in)}
.n2 .num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:Righteous,sans-serif;font-size:15px;background:var(--p);box-shadow:var(--in)}
.n2 .row.on .num{color:#fff;background:#E0177E;box-shadow:none}
.n2 .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.n2 .ctl{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:20px;min-height:56px;padding:12px 14px;cursor:pointer;color:var(--ink);background:var(--p);box-shadow:var(--up)}
.n2 .ctl:active,.n2 .row:active{box-shadow:var(--in)}
.n2 .hero{font-family:Righteous,sans-serif;font-weight:400;font-size:22px;letter-spacing:.04em;min-height:68px;border-radius:26px;color:#fff;background:var(--ink);box-shadow:0 16px 30px rgba(15,0,10,.55),inset 0 1px 0 rgba(255,255,255,.18)}
.n2 fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.n2 legend{padding:0;margin-bottom:10px}
.n2 .ans{display:flex;gap:12px;align-items:center}
.n2 .radio{appearance:none;flex:none;width:30px;height:30px;border-radius:50%;margin:0;cursor:pointer;display:grid;place-items:center;background:var(--p);box-shadow:var(--in)}
.n2 .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:#E0177E;transform:scale(0);transition:transform .15s}
.n2 .radio:checked::after{transform:scale(1)}
.n2 .radio:focus-visible{outline:3px solid #E0177E;outline-offset:2px}
.n2 .back{text-align:center;font-weight:700;font-size:16px}
</style>
</helmet>
<div class="n2" style="width: 390px; height: 1580px; overflow: hidden">
<header class="bar">
<span class="brand">ESCPARTY</span>
<button class="switch" type="button" role="switch" aria-checked="false"><span class="track"><span class="knob"></span></span>Sparkle mode</button>
</header>
<main>
<h1>Build a quiz</h1>
<p class="sub">Mix questions from the bank with your own, then save it to host or play.</p>
<section class="pane" aria-label="Quiz details">
<label class="lab" for="n2-name">Name</label>
<input class="field" id="n2-name" value="Jedward's Revenge">
<label class="lab" for="n2-break">Scoreboard break</label>
<div class="sel">
<select class="field" id="n2-break"><option>After every 5 questions</option><option>After every 10 questions</option><option>Only at the end</option></select>
<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#140810" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</div>
</section>
<section class="pane" aria-labelledby="n2-qs">
<div class="head"><h2 class="ph" id="n2-qs">Questions</h2><span class="count">3</span></div>
<ol>
<li><button class="row on" type="button" aria-pressed="true"><span class="num">1</span><span>Which country won in 1985 with “La det swinge”?</span></button></li>
<li><button class="row" type="button" aria-pressed="false"><span class="num">2</span><span>Who sang “Euphoria” for Sweden in 2012?</span></button></li>
<li><button class="row" type="button" aria-pressed="false"><span class="num">3</span><span>How many points is douze points?</span></button></li>
</ol>
<div class="two" style="margin-top: 8px">
<button class="ctl" type="button">Add from the bank</button>
<button class="ctl" type="button">Write a question</button>
</div>
</section>
<section class="pane" aria-labelledby="n2-edit">
<h2 class="ph" id="n2-edit">Edit question 1</h2>
<label class="lab" for="n2-q">Question</label>
<textarea class="field" id="n2-q" rows="2">Which country won in 1985 with “La det swinge”?</textarea>
<fieldset>
<legend class="lab">Answers, pick the right one</legend>
<div class="ans"><input class="radio" type="radio" name="n2-right" checked aria-label="Answer 1 is right"><input class="field" value="Norway" aria-label="Answer 1"></div>
<div class="ans"><input class="radio" type="radio" name="n2-right" aria-label="Answer 2 is right"><input class="field" value="Sweden" aria-label="Answer 2"></div>
<div class="ans"><input class="radio" type="radio" name="n2-right" aria-label="Answer 3 is right"><input class="field" value="Ireland" aria-label="Answer 3"></div>
<div class="ans"><input class="radio" type="radio" name="n2-right" aria-label="Answer 4 is right"><input class="field" value="Luxembourg" aria-label="Answer 4"></div>
</fieldset>
<div class="two" style="margin-top: 8px">
<button class="ctl" type="button">Save question</button>
<button class="ctl" type="button">Cancel</button>
</div>
</section>
<button class="ctl hero" type="button">Save quiz</button>
<a class="back" href="#">Back to the quiz library</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1580}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
