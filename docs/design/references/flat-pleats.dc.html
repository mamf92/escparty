<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build a quiz, flat pleats</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Righteous&amp;family=DM+Sans:opsz,wght@9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFC2E0}
.f1 *{box-sizing:border-box}
.f1{--ink:#140810;--blush:#FBE3EF;--pleat:repeating-linear-gradient(90deg,#140810 0 14px,#FFFFFF 14px 22px,#140810 22px 30px,#E9E2E6 30px 34px);font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:#3B0628}
.f1 .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;color:#fff}
.f1 .brand{font-family:Righteous,sans-serif;font-size:18px;letter-spacing:.1em}
.f1 .switch{display:flex;align-items:center;gap:10px;font:inherit;font-weight:700;font-size:14px;background:none;border:0;color:inherit;min-height:44px;cursor:pointer;padding:0}
.f1 .track{width:48px;height:28px;border-radius:14px;position:relative;background:#fff}
.f1 .knob{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--ink)}
.f1 .ribbon{height:22px;background:var(--pleat)}
.f1 main{padding:20px 20px 32px;display:flex;flex-direction:column;gap:18px}
.f1 h1{font-family:Righteous,sans-serif;font-weight:400;font-size:56px;line-height:.95;margin:6px 0 0;color:#fff}
.f1 .sub{margin:0;font-size:17px;line-height:1.45;color:#FCE3F1;max-width:30ch}
.f1 .pane{display:flex;flex-direction:column;gap:10px;padding:0 20px 22px;border-radius:22px;overflow:hidden;background:#fff}
.f1 .pleat{display:block;height:14px;margin:0 -20px 10px;background:var(--pleat)}
.f1 .lab{font-weight:700;font-size:14px;margin:4px 0 0;color:#A30A58}
.f1 .field{font:inherit;font-size:16px;font-weight:500;border:0;outline:0;padding:15px 18px;border-radius:12px;width:100%;color:var(--ink);background:var(--blush)}
.f1 .field:focus-visible{box-shadow:0 0 0 3px #E0177E}
.f1 textarea.field{resize:none;line-height:1.35}
.f1 .sel{position:relative}
.f1 select.field{appearance:none;padding-right:48px}
.f1 .chev{position:absolute;right:18px;top:50%;margin-top:-9px;pointer-events:none}
.f1 .ph{font-family:Righteous,sans-serif;font-weight:400;font-size:24px;margin:0}
.f1 .head{display:flex;align-items:center;gap:10px}
.f1 .count{font-size:14px;font-weight:700;color:#fff;background:#E0177E;border-radius:999px;padding:3px 12px}
.f1 ol{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.f1 .row{width:100%;display:flex;gap:14px;align-items:center;text-align:left;font:inherit;font-size:16px;font-weight:500;line-height:1.3;padding:14px 16px;border:0;border-radius:14px;cursor:pointer;color:var(--ink);background:var(--blush);min-height:60px}
.f1 .row.on{color:#fff;background:var(--ink)}
.f1 .num{flex:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-family:Righteous,sans-serif;font-size:15px;color:#fff;background:var(--ink)}
.f1 .row.on .num{background:#E0177E}
.f1 .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f1 .ctl{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:14px;min-height:56px;padding:12px 14px;cursor:pointer;color:var(--ink);background:var(--blush)}
.f1 .ctl.ink{color:#fff;background:var(--ink)}
.f1 .ctl:active,.f1 .row:active{transform:translateY(1px)}
.f1 .hero{position:relative;overflow:hidden;font-family:Righteous,sans-serif;font-weight:400;font-size:24px;letter-spacing:.04em;min-height:72px;border-radius:18px;color:#fff;background:var(--ink);padding-bottom:22px}
.f1 .hero .pleat{position:absolute;left:0;right:0;bottom:0;margin:0}
.f1 fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.f1 legend{padding:0;margin-bottom:10px}
.f1 .ans{display:flex;gap:12px;align-items:center}
.f1 .radio{appearance:none;flex:none;width:30px;height:30px;border-radius:8px;margin:0;cursor:pointer;display:grid;place-items:center;background:var(--blush)}
.f1 .radio::after{content:"";width:30px;height:30px;border-radius:8px;background:var(--ink);transform:scale(0);transition:transform .15s}
.f1 .radio:checked::after{transform:scale(1)}
.f1 .radio:focus-visible{outline:3px solid #E0177E;outline-offset:2px}
.f1 .back{text-align:center;font-weight:700;font-size:16px}
</style>
</helmet>
<div class="f1" style="width: 390px; height: 1580px; overflow: hidden">
<header class="bar">
<span class="brand">ESCPARTY</span>
<button class="switch" type="button" role="switch" aria-checked="false"><span class="track"><span class="knob"></span></span>Sparkle mode</button>
</header>
<div class="ribbon" aria-hidden="true"></div>
<main>
<h1>Build<br>a quiz</h1>
<p class="sub">Mix questions from the bank with your own, then save it to host or play.</p>
<section class="pane" aria-label="Quiz details">
<span class="pleat" aria-hidden="true"></span>
<label class="lab" for="f1-name">Name</label>
<input class="field" id="f1-name" value="Jedward's Revenge">
<label class="lab" for="f1-break">Scoreboard break</label>
<div class="sel">
<select class="field" id="f1-break"><option>After every 5 questions</option><option>After every 10 questions</option><option>Only at the end</option></select>
<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#140810" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</div>
</section>
<section class="pane" aria-labelledby="f1-qs">
<span class="pleat" aria-hidden="true"></span>
<div class="head"><h2 class="ph" id="f1-qs">Questions</h2><span class="count">3</span></div>
<ol>
<li><button class="row on" type="button" aria-pressed="true"><span class="num">1</span><span>Which country won in 1985 with “La det swinge”?</span></button></li>
<li><button class="row" type="button" aria-pressed="false"><span class="num">2</span><span>Who sang “Euphoria” for Sweden in 2012?</span></button></li>
<li><button class="row" type="button" aria-pressed="false"><span class="num">3</span><span>How many points is douze points?</span></button></li>
</ol>
<div class="two" style="margin-top: 8px">
<button class="ctl" type="button">Add from the bank</button>
<button class="ctl" type="button">Write a question</button>
</div>
</section>
<section class="pane" aria-labelledby="f1-edit">
<span class="pleat" aria-hidden="true"></span>
<h2 class="ph" id="f1-edit">Edit question 1</h2>
<label class="lab" for="f1-q">Question</label>
<textarea class="field" id="f1-q" rows="2">Which country won in 1985 with “La det swinge”?</textarea>
<fieldset>
<legend class="lab">Answers, pick the right one</legend>
<div class="ans"><input class="radio" type="radio" name="f1-right" checked aria-label="Answer 1 is right"><input class="field" value="Norway" aria-label="Answer 1"></div>
<div class="ans"><input class="radio" type="radio" name="f1-right" aria-label="Answer 2 is right"><input class="field" value="Sweden" aria-label="Answer 2"></div>
<div class="ans"><input class="radio" type="radio" name="f1-right" aria-label="Answer 3 is right"><input class="field" value="Ireland" aria-label="Answer 3"></div>
<div class="ans"><input class="radio" type="radio" name="f1-right" aria-label="Answer 4 is right"><input class="field" value="Luxembourg" aria-label="Answer 4"></div>
</fieldset>
<div class="two" style="margin-top: 8px">
<button class="ctl ink" type="button">Save question</button>
<button class="ctl" type="button">Cancel</button>
</div>
</section>
<button class="ctl hero" type="button">Save quiz<span class="pleat" aria-hidden="true"></span></button>
<a class="back" href="#">Back to the quiz library</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1580}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
