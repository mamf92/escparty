version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # react-dom checks at runtime that it matches react exactly, so the
      # four move in one PR. A security PR only bumps the packages its
      # advisory names: if it moves react or react-dom alone, bump the other
      # to the same version in that PR before merging. Keep these two lists
      # and the ignore list below in sync.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-security:
        applies-to: security-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: "development"
    # @react-three/fiber 9.8 supports react >=19 <19.4; raise this once it
    # supports 19.4 (package.json pins react and react-dom to ~19.3.0). The
    # types are held with them so they never describe APIs the installed
    # React doesn't have. This also blocks security updates to 19.4+: such an
    # alert stays on the Security tab until fiber supports 19.4.
    ignore:
      - dependency-name: "react"
        versions: [">=19.4.0"]
      - dependency-name: "react-dom"
        versions: [">=19.4.0"]
      - dependency-name: "@types/react"
        versions: [">=19.4.0"]
      - dependency-name: "@types/react-dom"
        versions: [">=19.4.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
