name: Firestore rules

# firestore.rules is production access control for every multiplayer room.
# This workflow makes the repo file the only way it changes:
#   - on a PR: verify it against the emulator, diff it against what's live,
#     and dry-run the deploy (compiles against the real project, proves the
#     service account still authenticates)
#   - on merge to main: deploy it, then read the live rules back and check
#     they match the file exactly
# See docs/agent/firestore-data-model.md ("Deploying rules").

on:
  pull_request:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - scripts/verify-firestore-rules.mjs
      - scripts/firestore-live-rules.mjs
      - .github/workflows/firestore-rules.yml
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - scripts/verify-firestore-rules.mjs
      - scripts/firestore-live-rules.mjs
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:
    inputs:
      overwrite_live:
        description: >-
          Deploy even if the live rules differ from this commit's (i.e. overwrite
          edits made in the Firebase console). Check the drift diff first.
        type: boolean
        default: false

permissions:
  contents: read

# Never run two deploys at once, and never cancel one halfway.
concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: false

env:
  FIREBASE_TOOLS: firebase-tools@15.31.0

jobs:
  verify:
    name: Verify rules against the emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache the emulator download
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ env.FIREBASE_TOOLS }}
      - run: npm ci
      - name: Run scripts/verify-firestore-rules.mjs
        run: >-
          npx -y "$FIREBASE_TOOLS" emulators:exec --only firestore
          --project demo-escparty "node scripts/verify-firestore-rules.mjs"

  production:
    name: ${{ github.event_name == 'pull_request' && 'Dry-run against production' || 'Deploy to production' }}
    needs: verify
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      # Secrets aren't passed to PRs from forks (or Dependabot). Those PRs
      # still get the emulator check above; this job skips itself.
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Skip without credentials
        if: env.HAS_KEY != 'true'
        run: echo "::notice::No FIREBASE_SERVICE_ACCOUNT secret available to this run; skipping the production checks."

      - name: Write the service account key
        if: env.HAS_KEY == 'true'
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_PROJECT_ID" || { echo "::error::Repo variable FIREBASE_PROJECT_ID is not set"; exit 1; }
          umask 077
          printf '%s' "$KEY" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      - name: Diff the live rules against the repo
        if: env.HAS_KEY == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node scripts/firestore-live-rules.mjs > "$RUNNER_TEMP/live.rules"

          # What the live rules *should* be right now, before this change:
          # the base branch's file on a PR, the previous commit's on a push.
          # A manual run has no "before", so it compares against itself.
          case "$GITHUB_EVENT_NAME" in
            pull_request) expected_ref="origin/$BASE_REF" ;;
            push)         expected_ref="$BEFORE_SHA" ;;
            *)            expected_ref="HEAD" ;;
          esac
          git show "$expected_ref:firestore.rules" > "$RUNNER_TEMP/expected.rules"

          {
            echo "## Live rules vs. \`$expected_ref\` (drift: edits made outside the repo)"
            if diff -u --label live --label "$expected_ref" "$RUNNER_TEMP/live.rules" "$RUNNER_TEMP/expected.rules" > "$RUNNER_TEMP/drift.diff"; then
              echo "None — production matches \`$expected_ref\`."
            else
              echo '```diff'; cat "$RUNNER_TEMP/drift.diff"; echo '```'
            fi
            echo "## Live rules vs. this commit (what deploying changes)"
            if diff -u --label live --label this-commit "$RUNNER_TEMP/live.rules" firestore.rules > "$RUNNER_TEMP/change.diff"; then
              echo "None — this commit's rules are already live."
            else
              echo '```diff'; cat "$RUNNER_TEMP/change.diff"; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s "$RUNNER_TEMP/drift.diff" ]; then
            echo "DRIFT=true" >> "$GITHUB_ENV"
            echo "::warning::Live rules differ from $expected_ref — see the job summary for the diff."
          fi

      - name: Dry-run the deploy
        if: env.HAS_KEY == 'true' && env.DEPLOY != 'true'
        run: npx -y "$FIREBASE_TOOLS" deploy --only firestore:rules --dry-run --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Refuse to overwrite console edits
        if: env.HAS_KEY == 'true' && env.DEPLOY == 'true' && env.DRIFT == 'true' && !inputs.overwrite_live
        run: |
          echo "::error::The live rules were changed outside the repo since the last deploy. Port those edits into firestore.rules, or re-run this workflow manually with overwrite_live if they should be discarded. The diff is in the job summary."
          exit 1

      - name: Deploy
        if: env.HAS_KEY == 'true' && env.DEPLOY == 'true'
        run: npx -y "$FIREBASE_TOOLS" deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Check the live rules now match the repo
        if: env.HAS_KEY == 'true' && env.DEPLOY == 'true'
        run: |
          node scripts/firestore-live-rules.mjs > "$RUNNER_TEMP/deployed.rules"
          diff -u --label live --label firestore.rules "$RUNNER_TEMP/deployed.rules" firestore.rules
          echo "Live rules match firestore.rules at $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
