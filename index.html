<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="ESCParty - The ultimate Eurovision fan experience! Play quizzes, discover songs, and bring the ESC magic to your party. Join the music!" />
  <meta name="keywords"
    content="Eurovision, ESCParty, ESC quiz, Eurovision songs, Eurovision party, music trivia, song discovery, ESC fans, Eurovision events, interactive quiz" />
  <meta name="author" content="Martin Fischer">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#3b0628">
  <!-- The design system's two families (docs/design/design-system.md). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
  <script>
    // Put the remembered theme on <html> before the first paint, so a
    // Sparkle visitor never sees a flash of Calm (src/design/theme.ts).
    try {
      var t = localStorage.getItem("escparty-theme");
      document.documentElement.dataset.theme = t === "sparkle" ? "sparkle" : "calm";
    } catch (e) {
      document.documentElement.dataset.theme = "calm";
    }
  </script>
  <title>ESCParty - Join the Music</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
